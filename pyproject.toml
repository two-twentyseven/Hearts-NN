[project]
name = "hearts-nn"
version = "0.1.0"
description = "A neural-network based AI for the card game hearts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hearts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
